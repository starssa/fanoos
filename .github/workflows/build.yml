# Builds every package on each push to main and publishes them as the release v<package.json version>
# (a new version number = a new release; the same number replaces that release's files).
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm test
      - name: Studio + scraper extension
        run: |
          npm run build:editor
          mkdir -p dist-packages
          (cd dist-editor && zip -qr ../dist-packages/fanoos-addon-studio.zip .)
      - name: Samsung TV (.wgt)
        run: npm run package:tizen
      - name: Android (.apk)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Same key as earlier builds (repo secret) so installed apps update in place; without it a new key is made.
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 -d > platforms/android/test.keystore; else echo "::warning::ANDROID_KEYSTORE_B64 secret not set: APK signed with a new key"; fi
          curl -sSfL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.4.1/apktool_2.4.1.jar
          APKTOOL_JAR=$PWD/apktool.jar sh tools/build-apk.sh
      - name: LG TV (.ipk)
        run: |
          npm run prepare:webos
          node -e "const f='build/webos/appinfo.json',j=require('./'+f);j.version=require('./package.json').version;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx -y -p @webos-tools/cli@3 ares-package build/webos -o dist-packages
      - name: Linux (.deb)
        run: sh tools/build-deb.sh
      - name: Name the files
        run: |
          V=$(node -p "require('./package.json').version")
          S=$(node -p "require('./scraper-extension/manifest.json').version")
          mkdir -p out
          cp dist-packages/Fanoos-unsigned.wgt out/Fanoos-$V-unsigned.wgt
          cp build/fanoos-unsigned.apk out/fanoos-$V-unsigned.apk # for signing with your own key
          cp dist-packages/fanoos-$V.apk dist-packages/fanoos_${V}_all.deb out/
          cp dist-packages/fanoos-addon-studio.zip out/Fanoos-Studio-$V-web.zip
          cp dist-packages/app.fanoos.mediacenter_${V}_all.ipk out/Fanoos-$V-webos.ipk
          cp dist-packages/fanoos-scraper.xpi out/fanoos-scraper-$S.xpi
          cp dist-packages/fanoos-scraper-chrome.zip out/fanoos-scraper-$S-chrome.zip
          ls -l out
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: fanoos-packages, path: out/* }
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Fanoos ${{ env.V }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: out/*

  desktop:
    needs: build # the release exists by then; these add the desktop files to it
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, app: '--win', studio: '--win' }
          - { os: ubuntu-latest, app: '--linux AppImage', studio: '--linux' }
          - { os: macos-latest, app: '', studio: '--mac --x64 --arm64' }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' } # unsigned: Windows SmartScreen / macOS Gatekeeper ask once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "V=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Fanoos app
        if: matrix.app != ''
        run: |
          npm run build && npm run prepare:electron
          cd platforms/electron && npm pkg set version=$V && npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.app }} --publish never
      - name: Fanoos Studio
        run: |
          npm run build:editor && node tools/prepare-platform.mjs studio
          cd platforms/studio && npm pkg set version=$V && npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.studio }} --publish never
      - name: Collect
        run: |
          mkdir -p out
          cp platforms/*/dist/*.exe platforms/*/dist/*.AppImage platforms/*/dist/*.dmg out/ 2>/dev/null || true
          rm -f out/*uninstaller* out/__uninstaller*
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: fanoos-desktop-${{ matrix.os }}
          path: out/*
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          files: out/*

  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: echo "V=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Capacitor iOS project
        run: |
          npm run build
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 @capacitor/app@6
          npx cap add ios
          npx cap sync ios
          # LAN repositories and the computer relay are plain http.
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist
      - name: Unsigned .ipa
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build/ios MARKETING_VERSION=$V CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p ipa/Payload out
          cp -R build/ios/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && zip -qr ../out/Fanoos-$V-ios-unsigned.ipa Payload)
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: fanoos-ios, path: out/* }
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          files: out/*
