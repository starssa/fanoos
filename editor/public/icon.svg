<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c48"/>
      <stop offset="1" stop-color="#0d0d22"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="560" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ff8a1f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9771f"/>
      <stop offset=".45" stop-color="#ffe08f"/>
      <stop offset="1" stop-color="#c3812a"/>
    </linearGradient>
    <radialGradient id="light" cx="512" cy="540" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset=".5" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="560" r="360" fill="url(#halo)"/>

  <g fill="url(#gold)">
    <!-- hanging ring and hook -->
    <circle cx="512" cy="146" r="34" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <rect x="503" y="178" width="18" height="40" rx="6"/>
    <!-- cap -->
    <path d="M446 254 Q512 196 578 254 Z"/>
    <rect x="426" y="250" width="172" height="24" rx="10"/>
    <!-- shoulders -->
    <path d="M404 274 H620 L664 352 H360 Z"/>
    <rect x="344" y="348" width="336" height="30" rx="12"/>
    <!-- body: frame around the glowing window -->
    <path d="M374 378 H650 L638 694 H386 Z"/>
    <!-- bottom band, base and foot -->
    <rect x="352" y="688" width="320" height="30" rx="12"/>
    <path d="M392 718 H632 L588 786 H436 Z"/>
    <rect x="466" y="784" width="92" height="26" rx="10"/>
  </g>

  <!-- panel edges for depth -->
  <g stroke="#8a5516" stroke-width="6" opacity=".45">
    <line x1="404" y1="382" x2="410" y2="688"/><line x1="620" y1="382" x2="614" y2="688"/>
  </g>
  <!-- pierced-metal dots on the shoulders -->
  <g fill="#3a2410" opacity=".55">
    <circle cx="452" cy="318" r="9"/><circle cx="512" cy="318" r="9"/><circle cx="572" cy="318" r="9"/>
    <circle cx="482" cy="296" r="6"/><circle cx="542" cy="296" r="6"/>
  </g>

  <!-- arched window of light -->
  <path d="M424 664 V506 Q424 420 512 402 Q600 420 600 506 V664 Z" fill="url(#light)"/>
  <!-- play symbol cut into the light -->
  <path d="M478 492 Q478 474 494 483 L580 534 Q594 542 580 550 L494 601 Q478 610 478 592 Z" fill="#1b1c48"/>
</svg>
